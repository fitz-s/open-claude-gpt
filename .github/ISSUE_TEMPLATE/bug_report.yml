name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please run `bin/cgc doctor --json` first — it pinpoints most issues.
  - type: markdown
    attributes:
      value: |
        **Before posting:** redact local usernames, home paths, ChatGPT project URLs,
        conversation IDs, and any repo/customer names you don't want public. Never
        paste secrets or `.env` contents.
  - type: textarea
    id: doctor
    attributes:
      label: doctor output
      description: Paste the output of `bin/cgc doctor --json`.
      render: json
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, what did you expect, what did you get? Include the exact `CGC_ERROR …` line if any.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS + Chrome version
      placeholder: "macOS 14.5, Chrome 149"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.6"
    validations:
      required: true
