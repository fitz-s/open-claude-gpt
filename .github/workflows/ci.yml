name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The claimed floor, the previous single pin, and a current version — on the CI-cheap OS.
          - { os: ubuntu-latest, python: "3.8" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          # The PRIMARY platform (launchd daemon, macOS Chrome paths) was previously never CI-run.
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node available (required for the sentinel-parser parity tests)
        run: node --version

      - name: Install runtime deps (pinned range — the install is part of the product)
        run: pip install "websocket-client>=1.6,<2" pyyaml pytest

      - name: Python scripts parse
        run: |
          python -c "import ast, glob; [ast.parse(open(f).read()) for f in glob.glob('skill/scripts/*.py')]"
          echo "all scripts parse"

      - name: Shell syntax
        run: |
          for f in install.sh uninstall.sh bin/cgc skill/scripts/*.sh; do
            bash -n "$f" && echo "ok: $f"
          done

      - name: Doctor runs and reports structured checks (no browser in CI is an expected NOT-READY, not a crash)
        run: |
          set -o pipefail
          out=$(NO_COLOR=1 CGC_HOME="$PWD/skill" python skill/scripts/cgc_doctor.py --json) || status=$?
          # exit != 0 means NOT READY (fine in CI); the failure mode we guard is a crash/empty output.
          echo "$out"
          test -n "$out" || { echo "::error::doctor produced no output"; exit 1; }
          echo "$out" | python -c "import json,sys; d=json.load(sys.stdin); assert 'ok' in d and d['checks']; print('doctor produced', len(d['checks']), 'checks')"

      - name: Test suite (offline; includes cross-implementation sentinel-parser parity)
        run: python -m pytest tests/ -q

      - name: No leaked local identity
        run: |
          # local machine identity must never ship (repo-owner login in github.com URLs is fine)
          if grep -rniE "leofitz|/Users/[a-z]|/home/[a-z]+/|g-p-[0-9a-f]{20}" \
               --include='*.py' --include='*.sh' --include='*.md' . ; then
            echo "::error::local identity leaked into the repo"; exit 1
          fi
          echo "clean"
